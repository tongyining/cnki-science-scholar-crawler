<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>论文自动化</title>
    <style>
        body {
            width: 400px;
            padding: 10px;
            font-family: sans-serif;
        }
        
        textarea {
            width: 100%;
            height: 150px;
            margin-bottom: 10px;
        }
        
        button {
            margin-right: 5px;
            margin-bottom: 5px;
            padding: 5px 10px;
            cursor: pointer;
        }
        
        .status {
            margin-top: 10px;
            font-size: 12px;
            color: #333;
        }
        
        .section {
            border-top: 1px solid #ccc;
            margin-top: 15px;
            padding-top: 10px;
        }
        
        .section-title {
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }
        
        .site-select {
            margin-bottom: 10px;
        }
        
        .site-select label {
            margin-right: 15px;
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background-color: #eee;
            margin-top: 10px;
            border-radius: 2px;
            overflow: hidden;
        }
        
        .progress-fill {
            width: 0%;
            height: 100%;
            background-color: #4caf50;
            transition: width 0.3s;
        }
        
        /* 遮罩层样式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }
        
        .modal-content {
            background-color: white;
            width: 90%;
            max-width: 800px;
            max-height: 80%;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .modal-header {
            padding: 15px;
            background-color: #f5f5f5;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-body {
            padding: 15px;
            overflow-y: auto;
            flex: 1;
        }
        
        .modal-footer {
            padding: 10px 15px;
            background-color: #f5f5f5;
            border-top: 1px solid #ddd;
            text-align: right;
        }
        
        .close-btn {
            cursor: pointer;
            font-size: 20px;
            background: none;
            border: none;
            padding: 0;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
        }
        
        th, td {
            border: 1px solid #ddd;
            padding: 6px;
            text-align: left;
            vertical-align: top;
        }
        
        th {
            background-color: #f5f5f5;
        }
        
        .export-btn {
            margin-left: 10px;
        }
        
        .tab-buttons {
            margin-bottom: 10px;
        }
        
        .tab-btn {
            margin-right: 5px;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        .modal-content.fullscreen {
            width: 98% !important;
            max-width: 98% !important;
            height: 95% !important;
            max-height: 95% !important;
        }
    </style>
</head>

<body>
    <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 data-i18n="title">论文自动化</h2>
        <select id="langSwitcher">
            <option value="zh" data-i18n="lang_zh">中文</option>
            <option value="en" data-i18n="lang_en">English</option>
            <option value="ja" data-i18n="lang_ja">日本語</option>
            <option value="de" data-i18n="lang_de">Deutsch</option>
            <option value="fr" data-i18n="lang_fr">Français</option>
        </select>
    </div>

    <!-- 下载区域 -->
    <div class="section">
        <div class="section-title" data-i18n="download_section">📥 文献下载</div>
        <textarea id="titlesInput" data-i18n-placeholder="titles_placeholder"></textarea>
        <div>
            <button id="startBtn" data-i18n="btn_start">▶ 开始下载</button>
            <button id="pauseBtn" data-i18n="btn_pause">⏸ 暂停</button>
            <button id="resumeBtn" data-i18n="btn_resume">▶ 恢复</button>
        </div>
    </div>

    <!-- 采集区域 -->
    <div class="section">
        <div class="section-title" data-i18n="collection_section">🔍 文献标题采集</div>
        <div class="site-select">
            <span data-i18n="source_cnki">采集源：</span>
            <label>
                <input type="radio" name="siteType" value="cnki" checked> <span data-i18n="source_cnki">中国知网</span>
            </label>
            <label>
                <input type="radio" name="siteType" value="science"> <span data-i18n="source_science">Science</span>
            </label>
        </div>
        <textarea id="collectionKeywords" data-i18n-placeholder="keywords_placeholder"></textarea>
        <div>
            <button id="startCollectionBtn" data-i18n="btn_start_collect">🚀 开始采集</button>
            <button id="pauseCollectionBtn" data-i18n="btn_pause_collect">⏸ 暂停采集</button>
            <button id="viewResultsBtn" data-i18n="btn_view_results">📊 查看结果</button>
            <button id="clearResultsBtn" data-i18n="btn_clear_results">🗑 清空结果</button>
            <button id="getchromestorage" data-i18n="btn_view_storage">查看存储里面的内容</button>
        </div>
        <div id="collectionStatus" class="status" data-i18n="status_ready">就绪</div>
        <div id="collectionProgress" class="progress-bar" style="display: none;">
            <div class="progress-fill"></div>
        </div>
    </div>

    <!-- 手动采集区域 (Science) -->
    <div class="section">
        <div class="section-title" data-i18n="manual_section">🖱️ 手动采集当前页（Science）</div>
        <div style="margin-bottom: 8px;">
            <label>
                <input type="radio" name="batchChoice" value="latest" checked> <span data-i18n="radio_latest">添加到最新批次</span>
            </label>
            <label style="margin-left: 15px;">
                <input type="radio" name="batchChoice" value="new"> <span data-i18n="radio_new">新建批次</span>
            </label>
        </div>
        <div>
            <button id="manualCollectBtn" data-i18n="btn_manual_collect">📄 采集当前页数据</button>
        </div>
        <div id="manualCollectStatus" class="status" style="margin-top: 6px;" data-i18n="status_ready">就绪</div>
    </div>

    <!-- 历史批次区域 -->
    <div class="section">
        <div class="section-title" data-i18n="history_section">📚 历史采集批次（最近10批）</div>
        <div id="batchList" style="max-height: 200px; overflow-y: auto; font-size: 12px;"></div>
    </div>

    <!-- 全局状态栏 -->
    <div class="status" id="status" data-i18n="status_ready">就绪</div>

    <!-- 结果展示模态框 -->
    <div id="resultModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span>📋 采集结果</span>
                <div>
                    <button id="fullscreenBtn" class="fullscreen-btn" style="margin-right: 10px;">⛶</button>
                    <button class="close-btn">✕</button>
                </div>
            </div>
            <div class="modal-body">
                <div class="tab-buttons">
                    <button id="tabAllBtn" class="tab-btn" data-i18n="tab_all">全部结果</button>
                    <button id="tabChineseBtn" class="tab-btn" data-i18n="tab_chinese">中文文献</button>
                    <button id="tabEnglishBtn" class="tab-btn" data-i18n="tab_english">英文文献</button>
                    <button id="exportExcelBtn" class="export-btn" data-i18n="btn_export_excel">📎 导出Excel</button>
                </div>
                <div id="tabAll" class="tab-content active">
                    <div id="allResultsTable"></div>
                </div>
                <div id="tabChinese" class="tab-content">
                    <div id="chineseResultsTable"></div>
                </div>
                <div id="tabEnglish" class="tab-content">
                    <div id="englishResultsTable"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="close-footer-btn" data-i18n="btn_close">关闭</button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>

</html>
